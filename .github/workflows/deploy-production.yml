name: Deploy to Production VPS (Fast)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests for hotfix'
        required: false
        default: false
        type: boolean

# Supersede an in-flight deploy when a newer commit lands on the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/smartlife-iot-platform
  DEPLOY_PATH: /var/www/smartlife-iot

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Lint + unit tests. Runs IN PARALLEL with `build` and is deliberately NOT
  # a dependency of `deploy`, so it stays off the critical path.
  #
  # NOTE: `continue-on-error` preserves the previous behaviour, where lint and
  # test failures never blocked a deploy (the old step combined them with a
  # bare `wait`, which always returned 0, plus continue-on-error). Unlike
  # before, failures are now at least VISIBLE as a red job. To make quality a
  # real gate, drop `continue-on-error` here and add `quality` to deploy.needs.
  # ─────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache the resolved node_modules tree, not just the npm download cache.
      # Keyed on the lockfile, so it is only rebuilt when deps actually change.
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      # --legacy-peer-deps is REQUIRED by this repo's dependency graph.
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

  # ─────────────────────────────────────────────────────────────────────────
  # Build & push the image. Runs in parallel with `quality`.
  #
  # This job intentionally does NOT run `npm ci` on the runner: the Docker
  # `dependencies` stage installs its own node_modules, so a runner-side
  # install was pure duplicated work on the critical path.
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=raw,value=latest,enable={{is_default_branch}}

      # Layer cache strategy.
      #
      # The GitHub Actions cache (type=gha) is capped at 10 GB per repo with LRU
      # eviction. With mode=max this multi-stage image (Debian + build toolchain
      # + compiled libredwg + two node_modules trees) exceeds that budget, so it
      # evicted itself between runs — every build recompiled libredwg from source
      # and rebuilt canvas. That is the main reason builds stayed at ~16 min
      # despite caching "being configured".
      #
      # A registry-backed cache has no such size cap, so the expensive base and
      # dependencies layers now actually survive between runs. gha is kept first
      # as a fast local hit; registry is the durable fallback.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: false
          build-args: |
            NODE_ENV=production

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            if [ ! -f .env.production ]; then
              echo "❌ ERROR: .env.production not found!"
              exit 1
            fi

            # Quick async backup — don't block deploy on it
            if docker compose -f docker-compose.prod.yml ps postgres | grep -q "Up"; then
              (
                BACKUP_FILE="backups/db-backup-$(date +%Y%m%d-%H%M%S).sql"
                docker compose -f docker-compose.prod.yml exec -T postgres \
                  pg_dump -U smartlife smartlife_iot > "$BACKUP_FILE" 2>/dev/null
                cd backups && ls -t db-backup-*.sql 2>/dev/null | tail -n +6 | xargs -r rm 2>/dev/null
              ) &
              BACKUP_PID=$!
            fi

            # Pull new image (fast — only pulls changed layers)
            echo "📥 Pulling latest image..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Only start infra if NOT already running — skip on normal deploys
            INFRA_RUNNING=$(docker compose -f docker-compose.prod.yml ps postgres 2>/dev/null | grep -c "Up" || echo "0")
            if [ "$INFRA_RUNNING" = "0" ]; then
              echo "🏗️ Starting infrastructure (cold start)..."
              docker compose -f docker-compose.prod.yml up -d postgres redis zookeeper kafka emqx

              # Parallel health checks — both run simultaneously
              echo "⏳ Waiting for infra..."
              timeout 60 sh -c 'until docker compose -f docker-compose.prod.yml exec -T postgres pg_isready -U smartlife 2>/dev/null; do sleep 1; done' &
              POSTGRES_PID=$!
              timeout 30 sh -c 'until docker compose -f docker-compose.prod.yml exec -T redis redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done' &
              REDIS_PID=$!
              wait $POSTGRES_PID $REDIS_PID
              echo "✅ Infra ready"
            else
              echo "✅ Infra already running, skipping"
            fi

            # Restart only the app container — zero infra disruption
            echo "🐳 Restarting app..."
            docker compose -f docker-compose.prod.yml up -d app --no-build --force-recreate

            # Faster health check poll (1s instead of 3s)
            echo "⏳ Waiting for app health..."
            timeout 60 sh -c 'until curl -f -s http://localhost:5000/health > /dev/null 2>&1; do sleep 1; done' \
              && echo "✅ App is healthy!" \
              || echo "⚠️ Health check timeout — check logs"

            # Run migrations after app is up
            echo "🗄️ Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T app npm run migration:run \
              || echo "⚠️ Migrations done (check warnings)"

            # Wait for backup to finish before cleanup
            wait $BACKUP_PID 2>/dev/null || true

            # Prune in background — don't block deploy completion
            docker image prune -f &

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yml ps

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            if ! docker compose -f docker-compose.prod.yml ps app | grep -q "Up"; then
              echo "❌ App container not running!"
              docker compose -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            fi
            curl -f -s http://localhost:5000/health > /dev/null 2>&1 \
              && echo "✅ Health check PASSED" \
              || echo "⚠️ Still initializing..."

  notify:
    name: Deployment Status
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Result
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 http://${{ secrets.VPS_HOST }}:5000"
          else
            echo "❌ Deployment failed — check logs"
            exit 1
          fi
