## ─────────────────────────────────────────────────────────────────────────
## EMQX 5 — device authentication and per-device topic authorization
## ─────────────────────────────────────────────────────────────────────────
##
## WHY THIS FILE EXISTS
##
## The application delegated MQTT authentication to EMQX ("MQTT auth lives in
## EMQX") and then shipped an EMQX that authenticated nobody. The compose file
## set `EMQX_ALLOW_ANONYMOUS=false`, which is **EMQX 4.x syntax and a no-op on
## 5.x** — as is `EMQX_LOADED_PLUGINS`. EMQX 5 with no authentication chain
## configured allows every connection, so the delegation pointed at nothing
## and the variable gave false comfort.
##
## Both decisions are delegated back to the application over HTTP:
##   authn  → is this a real device credential?
##   authz  → may THIS device use THIS topic?
##
## Authorization matters as much as authentication. Without it, any device
## holding valid credentials could publish on every other device's topic.

node {
  cookie = "${EMQX_NODE__COOKIE}"
  data_dir = "/opt/emqx/data"
}

## ── Authentication ───────────────────────────────────────────────────────
## A device connects with its access token as the MQTT username (password
## empty), or with a username/password pair. The application resolves both.
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true

    method = post
    url = "http://app:5000/device-auth/mqtt/authn"
    headers { "content-type" = "application/json" }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
      peerhost = "${peerhost}"
    }

    ## A slow or unreachable application must not hang the broker. EMQX
    ## treats a failed request as a denial, so this fails CLOSED.
    request_timeout = "5s"
    pool_size = 8
  }
]

## ── Authorization ────────────────────────────────────────────────────────
authorization {
  ## Anything the sources below do not explicitly allow is denied, and the
  ## client is disconnected rather than silently dropped — a device whose
  ## publishes vanish is far harder to debug than one that cannot connect.
  no_match = deny
  deny_action = disconnect

  cache { enable = true, max_size = 32, ttl = "1m" }

  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://app:5000/device-auth/mqtt/authz"
      headers { "content-type" = "application/json" }
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      request_timeout = "5s"
      pool_size = 8
    }
  ]
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket.mqtt_path = "/mqtt"
}

dashboard {
  listeners.http { bind = 18083 }
  default_username = "${EMQX_DASHBOARD__DEFAULT_USERNAME}"
  default_password = "${EMQX_DASHBOARD__DEFAULT_PASSWORD}"
}

log.console_handler {
  enable = true
  level = warning
}
