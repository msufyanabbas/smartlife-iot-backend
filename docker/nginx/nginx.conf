# docker/nginx/nginx.conf
#
# The load balancer in front of the scaled `app` replicas (see
# docker-compose.scale.yml). It exists for two reasons, and the second one is
# the one that is easy to get wrong.
#
#  1. `--scale app=N` cannot publish a host port, so something has to.
#  2. Socket.IO. A WebSocket needs the Upgrade/Connection headers forwarded or
#     the handshake silently falls back to HTTP long-polling — and a
#     long-polling session is a SEQUENCE of requests that must all reach the
#     same replica. With plain round-robin they do not, and the client gets
#     `{"code":1,"message":"Session ID unknown"}` on its second poll and
#     reconnect-loops for ever.
#
#     Both halves are needed: `ip_hash` keeps a polling session on one replica,
#     and the Upgrade headers let it become a real socket in the first place.
#     The Socket.IO Redis adapter (lib/websocket/redis-io.adapter.ts) handles
#     the OTHER half of the problem — getting a message produced on replica A
#     to a socket held by replica B — and does not remove the need for either
#     of these.

events {
  worker_connections 4096;
}

http {
  # Docker's embedded DNS resolves `app` to every replica's address.
  # ip_hash pins a client to one replica, which is what makes HTTP long-polling
  # work. It is NOT what makes WebSocket pushes work — the Redis adapter is.
  upstream smartlife_app {
    ip_hash;
    server app:5000;
  }

  # Firmware binaries and floor-plan DWGs are uploaded through this proxy;
  # nginx's 1m default would reject them with a 413 before the application's
  # own size checks ever ran.
  client_max_body_size 64m;

  # A WebSocket that is idle between telemetry frames must not be cut.
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    # The application reads x-forwarded-for when TRUST_PROXY is on (it defaults
    # to on in production). Without these the rate limiter buckets the whole
    # internet into one client and the audit log records nginx's address.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Socket.IO: all three namespaces (/ws, /alarms, /telemetry) are served
    # under the one Socket.IO path.
    location /socket.io/ {
      proxy_pass http://smartlife_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://smartlife_app;
      proxy_http_version 1.1;
      # Harmless for plain HTTP and required if a client opens a socket on a
      # non-default path.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
